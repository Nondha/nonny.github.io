<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geometry Dash Clone</title>
  <style>
    body {
      margin: 0;
      background: #111;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: auto;
      background: linear-gradient(#222, #444);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 50, y: 300, width: 40, height: 40, dy: 0, jumpPower: -12, gravity: 0.6 };
    let obstacles = [];
    let frame = 0;
    let gameOver = false;

    function drawPlayer() {
      ctx.fillStyle = "#00ffcc";
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawObstacles() {
      ctx.fillStyle = "#ff3333";
      obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      });
    }

    function updatePlayer() {
      player.dy += player.gravity;
      player.y += player.dy;
      if (player.y > 300) {
        player.y = 300;
        player.dy = 0;
      }
    }

    function updateObstacles() {
      obstacles.forEach(obs => obs.x -= 5);
      obstacles = obstacles.filter(obs => obs.x + obs.width > 0);
      if (frame % 90 === 0) {
        obstacles.push({ x: 800, y: 340, width: 40, height: 60 });
      }
    }

    function checkCollision() {
      obstacles.forEach(obs => {
        if (
          player.x < obs.x + obs.width &&
          player.x + player.width > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          gameOver = true;
        }
      });
    }

    function gameLoop() {
      if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("Game Over!", 300, 200);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPlayer();
      drawObstacles();
      updatePlayer();
      updateObstacles();
      checkCollision();
      frame++;
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", e => {
      if (e.code === "Space" && player.y >= 300) {
        player.dy = player.jumpPower;
      }
    });

    gameLoop();
  </script>
</body>
</html>
